<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Importar Compras SUNAT — NEXUM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 20px; background: #f0f4f8; }
  h2 { color: #2d3748; }
  input, button { padding: 10px; margin: 6px 0; width: 100%; box-sizing: border-box; border-radius: 6px; border: 1px solid #cbd5e0; font-size: 14px; }
  button { background: #2c5282; color: white; border: none; cursor: pointer; font-size: 15px; font-weight: bold; }
  button:hover { background: #2a4a7f; }
  button:disabled { background: #a0aec0; cursor: not-allowed; }
  #log { background: #1a202c; color: #68d391; padding: 16px; border-radius: 8px; font-family: monospace; font-size: 13px; white-space: pre-wrap; max-height: 400px; overflow-y: auto; margin-top: 16px; display: none; }
  .error { color: #fc8181; }
  .ok { color: #68d391; }
  .warn { color: #f6e05e; }
  .section { background: white; border-radius: 10px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  label { font-size: 13px; color: #4a5568; font-weight: 600; }
</style>
</head>
<body>
<h2>📥 Importar Registro de Compras SUNAT</h2>
<p style="color:#718096;font-size:13px">Herramienta directa — sin caché. Ingresa tus credenciales de NEXUM para importar.</p>

<div class="section">
  <label>Email NEXUM</label>
  <input type="email" id="email" placeholder="tu@email.com" />
  <label>Contraseña NEXUM</label>
  <input type="password" id="pass" placeholder="contraseña" />
  <button onclick="login()">🔐 Iniciar sesión</button>
  <div id="login-status" style="font-size:13px;margin-top:8px;color:#2f855a"></div>
</div>

<div class="section" id="sec-import" style="display:none">
  <label>Archivo Excel (formato SUNAT)</label>
  <input type="file" id="archivo" accept=".xlsx,.xls" />
  <button id="btn-import" onclick="importar()" disabled>📤 Importar a Supabase</button>
</div>

<div id="log"></div>

<script>
const SUPA_URL = 'https://ncfnhjyqehvdqzikjhmg.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5jZm5oanlxZWh2ZHF6aWtqaG1nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MzQ0NTAsImV4cCI6MjA5MjMxMDQ1MH0.n_fDdqDQFANPJ9ySD0KBztSCwodBFVn0hBFbW8WNySk';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);
let empresa_id = null;

function log(msg, tipo = '') {
  const el = document.getElementById('log');
  el.style.display = 'block';
  el.innerHTML += `<span class="${tipo}">${msg}\n</span>`;
  el.scrollTop = el.scrollHeight;
}

function _sunatFecha(val) {
  if (val === null || val === undefined || val === '') return null;
  if (typeof val === 'number') {
    const d = new Date(Math.round((val - 25569) * 86400 * 1000));
    if (isNaN(d.getTime())) return null;
    return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
  }
  if (val instanceof Date) {
    if (isNaN(val.getTime())) return null;
    return `${val.getUTCFullYear()}-${String(val.getUTCMonth()+1).padStart(2,'0')}-${String(val.getUTCDate()).padStart(2,'0')}`;
  }
  const s = val.toString().trim();
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const d2 = new Date(s);
  return isNaN(d2.getTime()) ? null : d2.toISOString().slice(0,10);
}
function _sunatNum(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function _sunatStr(v) { if (v == null || v === '') return null; return v.toString().trim().replace(/\s+/g,' ') || null; }
function _sunatRUC(v) { if (v == null || v === '') return null; return (typeof v === 'number') ? Math.round(v).toString() : v.toString().trim() || null; }
function _sunatTDoc(v) { if (v == null || v === '') return null; const n=parseInt(v); return isNaN(n)?v.toString().trim():String(n).padStart(2,'0'); }
function _sunatMoneda(v) { if (!v) return 'PEN'; const s=v.toString().trim().toUpperCase(); if(['USD','2','US$','$'].includes(s))return'USD'; if(['EUR','3'].includes(s))return'EUR'; return'PEN'; }

async function login() {
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('pass').value;
  if (!email || !pass) { alert('Ingresa email y contraseña'); return; }

  document.getElementById('login-status').textContent = 'Iniciando sesión...';
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) {
    document.getElementById('login-status').style.color = '#e53e3e';
    document.getElementById('login-status').textContent = '❌ Error: ' + error.message;
    return;
  }

  // Buscar empresa del usuario
  const { data: asig } = await sb.from('asignaciones_usuario').select('empresa_operadora_id').eq('usuario_id', data.user.id).limit(1).single();
  if (asig) empresa_id = asig.empresa_operadora_id;
  else {
    const { data: emp } = await sb.from('empresas_operadoras').select('id').limit(1).single();
    if (emp) empresa_id = emp.id;
  }

  document.getElementById('login-status').style.color = '#2f855a';
  document.getElementById('login-status').textContent = '✅ Sesión iniciada. Empresa ID: ' + empresa_id;
  document.getElementById('sec-import').style.display = 'block';
  document.getElementById('archivo').onchange = () => {
    document.getElementById('btn-import').disabled = false;
  };
}

async function importar() {
  const file = document.getElementById('archivo').files[0];
  if (!file) { alert('Selecciona un archivo Excel'); return; }
  if (!empresa_id) { alert('No se encontró empresa activa'); return; }

  document.getElementById('btn-import').disabled = true;
  document.getElementById('log').innerHTML = '';
  log('Leyendo archivo: ' + file.name, 'warn');

  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array', cellDates: false });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });

  let inicio = 0;
  for (let i = 0; i < Math.min(rows.length, 5); i++) {
    if (_sunatFecha(rows[i][4])) { inicio = i; break; }
  }
  const data = rows.slice(inicio).filter(r => r[4] != null || r[24] != null);
  log(`Filas leídas: ${data.length} (desde fila ${inicio+1})`, 'warn');

  const registros = data.map((r, i) => {
    const fecha = _sunatFecha(r[4]);
    const total = _sunatNum(r[24]);
    const serie = _sunatStr(r[7]);
    const nroRaw = r[9] != null ? parseInt(r[9]) || _sunatStr(r[9]) : null;
    const numero = nroRaw != null ? String(nroRaw) : null;
    const periodoRaw = _sunatStr(r[2]);
    const periodo = periodoRaw && /^\d{6}$/.test(periodoRaw)
      ? periodoRaw.slice(0,4) + '-' + periodoRaw.slice(4,6)
      : (fecha ? fecha.slice(0,7) : null);
    return {
      empresa_operadora_id: empresa_id,
      periodo, fecha_emision: fecha, fecha_vencimiento: _sunatFecha(r[5]),
      tipo_documento_codigo: _sunatTDoc(r[6]), serie, numero,
      ruc_proveedor: _sunatRUC(r[12]), nombre_proveedor: _sunatStr(r[13]),
      base_imponible: _sunatNum(r[14]), igv: _sunatNum(r[15]), total,
      moneda: _sunatMoneda(r[25]), tipo_cambio: _sunatNum(r[26]) || 1,
      codigo_detraccion: _sunatStr(r[37]), estado: 'EMITIDO',
      _ok: !!fecha && total !== 0 && !!serie,
    };
  });

  const validos = registros.filter(r => r._ok);
  const invalidos = registros.length - validos.length;
  log(`Válidos: ${validos.length}  |  Inválidos (omitidos): ${invalidos}`, 'warn');
  if (!validos.length) { log('No hay registros válidos para importar.', 'error'); document.getElementById('btn-import').disabled = false; return; }

  let ok = 0, duplicados = 0, errores = 0;

  for (let i = 0; i < validos.length; i += 50) {
    const chunk = validos.slice(i, i + 50).map(({ _ok, ...r }) => r);
    const { data: ins, error } = await sb.from('registro_compras').insert(chunk).select('id');

    if (!error) {
      ok += ins?.length ?? 0;
      log(`Chunk ${Math.floor(i/50)+1}: ✅ ${ins?.length ?? 0} insertados`, 'ok');
    } else if (error.code === '23505') {
      log(`Chunk ${Math.floor(i/50)+1}: duplicados detectados, reintentando uno a uno...`, 'warn');
      for (const row of chunk) {
        const { data: r2, error: e2 } = await sb.from('registro_compras').insert(row).select('id').maybeSingle();
        if (!e2) ok++;
        else if (e2.code === '23505') duplicados++;
        else { errores++; log(`  ❌ Error en fila: ${JSON.stringify(e2)}`, 'error'); }
      }
    } else {
      errores += chunk.length;
      log(`Chunk ${Math.floor(i/50)+1}: ❌ ERROR`, 'error');
      log(`  Code: ${error.code}`, 'error');
      log(`  Message: ${error.message}`, 'error');
      log(`  Details: ${error.details}`, 'error');
      log(`  Hint: ${error.hint}`, 'error');
      log(`  Primer registro del chunk: ${JSON.stringify(chunk[0])}`, 'warn');
    }
  }

  log('', '');
  log(`═══════════════════════════════`, 'ok');
  log(`✅ Importados: ${ok}`, 'ok');
  log(`⚠️  Ya existían (duplicados): ${duplicados}`, 'warn');
  log(`❌ Errores reales: ${errores}`, errores > 0 ? 'error' : 'ok');
  log(`═══════════════════════════════`, 'ok');

  document.getElementById('btn-import').disabled = false;
}
</script>
</body>
</html>
